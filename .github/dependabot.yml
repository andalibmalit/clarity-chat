# Monthly, grouped into one pull request per ecosystem. tokenizers, transformers and jinja2
# can change output, pypdf the text extracted from a PDF, and inspect-ai the log Clarity
# writes for Inspect, so each gets its own pull request and the live tests (CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns:
          - "*"
        exclude-patterns:
          - "tokenizers"
          - "transformers"
          - "jinja2"
          - "pypdf"
          - "inspect-ai"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"

# Lint, type-check and test on Linux, Windows and macOS: the real test of the
# cross-platform and UTF-8 rules. The `test` and `browser` jobs need no network, no model
# and no llama-server; `live-cpu` builds llama-server and runs the SmolLM2 live tier.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      # Actions are pinned to commit SHAs (a tag can be moved); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true  # PyTorch on Linux is about 2.5 GB with NVIDIA's libraries
      # With the hf extra (PyTorch) and the inspect extra at the locked versions users install,
      # so the offline probability and Inspect export tests run on every system instead of
      # skipping.
      - run: uv sync --locked --extra hf --extra inspect
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      # Which CPU this runner has, and what PyTorch thinks it supports: some Windows
      # runners crash with an illegal instruction in the first bf16 matmul on the CPU.
      - run: uv run python scripts/cpu_info.py
      - run: uv run pytest
        if: matrix.os != 'windows-latest'
      # Windows only: some GitHub Windows VMs (Xeon Platinum 8573C, model 207, with AMX)
      # crash with an illegal instruction (0xc000001d) in oneDNN's AMX bf16 kernel, a
      # PyTorch/oneDNN bug reported by several projects but not upstream (our two crashes
      # were in that kernel; their hosts' CPU wasn't captured). Capping oneDNN below AMX
      # avoids it; on the AMD hosts we've seen, PyTorch uses AVX2 anyway, so the
      # cap changes nothing there. No test is skipped. Clarity's own handling of such hosts
      # (logging ONEDNN_*, refusing instead of crashing) is planned for v0.7.0.
      - run: uv run pytest
        if: matrix.os == 'windows-latest'
        env:
          ONEDNN_MAX_CPU_ISA: AVX512_CORE_BF16

  # The web interface in a real browser (Playwright's Chromium), on Linux only: the page,
  # its secret, a page on another port, and a reply joined after a reload mid-reply.
  browser:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --group browser --extra inspect
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser -v

  # The same tier in Playwright's WebKit and Firefox (v0.3.1, E2): the page has been checked
  # in Chrome only, and these engines are Safari's and Firefox's. Allowed to fail until its
  # failures are read: the counts and each failure go to the job summary, so they show
  # without opening the log. Failures in the attach screens are fixed in v0.3.1; others
  # are listed for v0.4.0. WebKit runs on macOS, closer to Safari and where Playwright's
  # WebKit is best supported: on ubuntu-latest it closed at the first test (CI 43754075636).
  browser-others:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # an engine where many waits time out shouldn't run for six hours
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: webkit
            os: macos-latest
          - engine: firefox
            os: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --group browser --extra inspect
      # The system libraries an engine needs: on Linux only; macOS has them.
      - run: uv run playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} ${{ matrix.engine }}
      - run: uv run pytest -m browser --browser ${{ matrix.engine }} -v --junitxml=browser.xml
      - name: Counts and failures to the job summary
        if: ${{ !cancelled() }}
        run: uv run python scripts/junit_summary.py browser.xml ${{ matrix.engine }} >> "$GITHUB_STEP_SUMMARY"

  # The SmolLM2 live tier on a CPU build of the pinned llama.cpp, on Linux, so the code that
  # makes Clarity exact (llama-server's flags, the prompt IDs it echoes, seeds, replay) is
  # tested on every push, not only on the maintainer's Mac. Plan: notes/plans/ci-live-linux.md.
  # It changes no source: the CPU route is the one-line server.toml edit the docs give a CPU
  # user, and the GPU placement check is deselected by its marker (`-m "live and not gpu"`).
  # A failed same-output, replay or hash check here is a finding to investigate, not to mark.
  live-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # No hf extra: no live test imports torch. The converter gets its own environment. The
      # inspect extra: a SmolLM2 run is exported for Inspect and read back.
      - run: uv sync --locked --extra inspect
      # The build flags are set here, in this step only, and passed on as outputs: a job-level
      # variable would reach llama-server, and Clarity warns about any LLAMA_* or GGML_* it
      # inherits. GGML_NATIVE=OFF: one binary for every runner (SSE 4.2 to AVX2, no AVX-512),
      # since the cache may hand it to a runner with another CPU. LLAMA_USE_PREBUILT_UI=OFF: no
      # web UI downloaded at build time (Clarity runs --no-webui). The cache key holds their hash.
      - name: The pinned llama.cpp commit (checked by Clarity's own loader), image and flags
        id: pin
        env:
          CMAKE_FLAGS: -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DLLAMA_USE_PREBUILT_UI=OFF
        run: |
          commit=$(uv run python -c 'from pathlib import Path; from clarity_chat.profiles import load_server_config; print(load_server_config(Path.cwd()).llama_cpp_commit)')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "cmake-flags=$CMAKE_FLAGS" >> "$GITHUB_OUTPUT"
          echo "flags-hash=$(printf '%s' "$CMAKE_FLAGS" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Every run, cache hit or not: each server start and each fetch read the commit from
      # this checkout, and the converter comes from it. Only the built binaries are cached.
      - name: Check out llama.cpp at that commit
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          git init -q vendor/llama.cpp
          git -C vendor/llama.cpp fetch -q --depth 1 https://github.com/ggml-org/llama.cpp "$COMMIT"
          git -C vendor/llama.cpp checkout -q --detach "$COMMIT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: llama-bin
        with:
          path: vendor/llama.cpp/build/bin
          # Exact, with no restore-keys: Clarity refuses a binary from another commit, and the
          # flags' hash changes the key when they change.
          key: llama-bin-${{ runner.arch }}-${{ steps.pin.outputs.image }}-${{ steps.pin.outputs.flags-hash }}-${{ steps.pin.outputs.commit }}
      - name: Build llama-server and llama-quantize for the CPU
        if: steps.llama-bin.outputs.cache-hit != 'true'
        env:
          CMAKE_FLAGS: ${{ steps.pin.outputs.cmake-flags }}
        run: |
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build $CMAKE_FLAGS
          cmake --build vendor/llama.cpp/build --config Release -j "$(nproc)" \
            --target llama-server llama-quantize
      - run: vendor/llama.cpp/build/bin/llama-server --version  # a broken cached binary fails here
      # Hugging Face's cache: SmolLM2's source files and the third-party GGUF the download
      # test fetches. A change to models.toml starts it afresh, so old snapshots don't pile up.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-${{ hashFiles('models.toml') }}
      # Fetch on every run, so a fetch regression shows at once. Fetch records the model in
      # local/models.lock with its own hash, so remove that and verify the Linux-made file
      # against the committed entry (made on the Mac); verify also records the file's new
      # time, in local/models.lock. The fetch runs as install.sh runs Clarity: `env -i` with
      # HOME and a PATH without uv's folder, as on a fresh Mac, so a command found only on the
      # job's PATH (the whole-branch review's M1: the converter ran a bare `uv`) fails here.
      # setup-uv's cache and Python folders are passed on when it sets them, so the
      # converter's 2.5 GB of torch and NVIDIA wheels aren't downloaded again every run.
      - name: Fetch SmolLM2 in the install's environment
        run: |
          uv=$(command -v uv)
          bare=/usr/bin:/bin:/usr/sbin:/sbin
          if env -i PATH="$bare" sh -c 'command -v uv'; then echo "uv is on the bare PATH"; exit 1; fi
          env -i HOME="$HOME" PATH="$bare" \
            ${UV_CACHE_DIR:+"UV_CACHE_DIR=$UV_CACHE_DIR"} \
            ${UV_PYTHON_INSTALL_DIR:+"UV_PYTHON_INSTALL_DIR=$UV_PYTHON_INSTALL_DIR"} \
            "$uv" run clarity fetch smollm2-135m-instruct
      - run: rm local/models.lock
      - run: uv run clarity verify smollm2-135m-instruct
      - name: server.toml for the CPU, one line and nothing else
        run: |
          sed -i 's/^n-gpu-layers = "all".*/n-gpu-layers = 0  # CI: a CPU build/' server.toml
          git diff server.toml
          test "$(git diff --numstat server.toml)" = "$(printf '1\t1\tserver.toml')"
      - run: nproc
      - name: The live tests that don't need a GPU
        run: uv run pytest -m "live and not gpu" -v -rs --junitxml=live.xml
      # The live tier skips itself without llama-server or the model, and one test skips
      # without llama-quantize: here a skip fails the job, as does a run of fewer tests than
      # the 20 that run today (a marker that deselected a module would leave a few).
      - run: uv run python scripts/junit_guard.py live.xml --at-least 20
      - name: Deselected here, since they need a GPU
        if: ${{ !cancelled() }}
        run: uv run pytest --collect-only -q -m "live and gpu" >> "$GITHUB_STEP_SUMMARY"

# Lint, type-check and test on Linux, Windows and macOS: the real test of the
# cross-platform and UTF-8 rules. Tests need no network, no model and no llama-server.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      # Actions are pinned to commit SHAs (a tag can be moved); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true  # PyTorch on Linux is about 2.5 GB with NVIDIA's libraries
      # With the hf extra (PyTorch) at the locked versions users install, so the offline
      # probability tests run on every system instead of skipping.
      - run: uv sync --locked --extra hf
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      # Which CPU this runner has, and what PyTorch thinks it supports: some Windows
      # runners crash with an illegal instruction in the first bf16 matmul on the CPU.
      - run: uv run python scripts/cpu_info.py
      - run: uv run pytest
        if: matrix.os != 'windows-latest'
      # Windows only: some GitHub Windows VMs (Xeon Platinum 8573C, model 207, with AMX)
      # crash with an illegal instruction (0xc000001d) in oneDNN's AMX bf16 kernel, a
      # PyTorch/oneDNN bug reported by several projects but not upstream (our two crashes
      # were in that kernel; their hosts' CPU wasn't captured). Capping oneDNN below AMX
      # avoids it; on the AMD hosts we've seen, PyTorch uses AVX2 anyway, so the
      # cap changes nothing there. No test is skipped. Clarity's own handling of such hosts
      # (logging ONEDNN_*, refusing instead of crashing) is planned for v0.7.0.
      - run: uv run pytest
        if: matrix.os == 'windows-latest'
        env:
          ONEDNN_MAX_CPU_ISA: AVX512_CORE_BF16

  # The web interface in a real browser (Playwright's Chromium), on Linux only: the page,
  # its secret, a page on another port, and a reply joined after a reload mid-reply.
  browser:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --group browser
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser -v

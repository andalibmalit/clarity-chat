# Development profile: SmolLM2-135M-Instruct through its own chat template.
backend = "llama.cpp"
model = "smollm2-135m-instruct"
mode = "chat"
system = "You are a helpful assistant."

[settings]
temperature = 0.6
top_p = 0.95
top_k = 0
min_p = 0.0
repeat_penalty = 1.0
max_tokens = 128
seed = 42
samplers = ["top_k", "top_p", "min_p", "temperature"]

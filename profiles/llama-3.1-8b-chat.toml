# Llama 3.1 8B Instruct through its own chat template. With no system message of your own,
# the template still writes a system header: "Cutting Knowledge Date: December 2023" and
# "Today Date: 26 Jul 2024". The date is the template's fixed default, not today's, so a
# chat renders the same tokens on any day. `template_kwargs = { date_string = "..." }`
# sets another.
description = "Standard chat with no system message of your own; Llama's chat template still adds a system header that says today is 26 Jul 2024"
backend = "llama.cpp"
model = "llama-3.1-8b-instruct"
mode = "chat"
# temperature (0.6) and top_p (0.9) come from Meta's generation_config.json at the commit
# pinned in models.toml, logged with origin `model`.
use_recommended = true

# As the OLMo 3 profiles: every other sampler off.
[settings]
top_k = 0
min_p = 0.0
repeat_penalty = 1.0
max_tokens = 1024
seed = 42
samplers = ["top_k", "top_p", "min_p", "temperature"]

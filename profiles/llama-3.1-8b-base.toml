# Llama 3.1 8B base (pretrained only, no chat tuning) continuing a plain document, as
# 5-raw-base does for OLMo 3. No chat template runs; the tokenizer's BOS is prepended.
description = "Plain text, no chat format: the untuned base model continues a written conversation"
backend = "llama.cpp"
model = "llama-3.1-8b-base"
mode = "text"
header = { file = "../prompts/header.txt" }
user_name = "User"
assistant_name = "Assistant"
# temperature (0.6) and top_p (0.9) come from Meta's generation_config.json at the commit
# pinned in models.toml, logged with origin `model`.
use_recommended = true

# As the OLMo 3 profiles: every other sampler off.
[settings]
top_k = 0
min_p = 0.0
repeat_penalty = 1.0
max_tokens = 1024
seed = 42
samplers = ["top_k", "top_p", "min_p", "temperature"]

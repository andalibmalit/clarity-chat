# Check 0, setup 4: the instruct model continuing a plain document (no chat template).
description = "Plain text, no chat format: the chat-tuned model continues a written conversation"
backend = "llama.cpp"
model = "olmo-3-7b-instruct"
mode = "text"
header = { file = "../prompts/header.txt" }
user_name = "User"
assistant_name = "Assistant"

# Check 0 settings, shared by every Check 0 profile (OLMo 3's generation_config.json values
# for temperature and top_p; everything else off). The context size (8192) is in server.toml.
[settings]
temperature = 0.6
top_p = 0.95
top_k = 0
min_p = 0.0
repeat_penalty = 1.0
max_tokens = 1024
seed = 42
samplers = ["top_k", "top_p", "min_p", "temperature"]

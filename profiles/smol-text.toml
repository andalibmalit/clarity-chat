# Development profile: SmolLM2-135M-Instruct continuing a plain document.
backend = "llama.cpp"
model = "smollm2-135m-instruct"
mode = "text"
header = "A conversation between User and Assistant.\n\n"
user_name = "User"
assistant_name = "Assistant"

[settings]
temperature = 0.6
top_p = 0.95
top_k = 0
min_p = 0.0
repeat_penalty = 1.0
max_tokens = 128
seed = 42
samplers = ["top_k", "top_p", "min_p", "temperature"]

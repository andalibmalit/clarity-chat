# Models, listed by hand. `clarity fetch NAME` resolves one entry and writes what it
# resolved to models.lock; it never edits this file.
#
# route = "convert": download `repo` at `revision` and convert it to a bf16 GGUF with
#                    the llama.cpp checkout's convert_hf_to_gguf.py.
# route = "gguf":    download `file` from `repo` at `revision` and check its `sha256`.
# tokenizer_repo / tokenizer_revision: the Hugging Face tokenizer the client renders and
# tokenizes with (for a converted model, its source repo and commit).
# weights = "pytorch_model.bin" (convert route, optional; the only value it accepts): also
#                    download that file, for a model whose publisher ships its weights only
#                    as a pickle. The converter loads it with torch's restricted loader.
# weights_sha256:    with `weights`: the file's sha256, checked before the converter
#                    loads it. A mismatch stops the fetch.
# Revisions are full commit hashes, so a name always means the same files.

[smollm2-135m-instruct]
# Tiny model for development tests (Apache 2.0).
route = "convert"
repo = "HuggingFaceTB/SmolLM2-135M-Instruct"
revision = "12fd25f77366fa6b3b4b768ec3050bf629380bac"
tokenizer_repo = "HuggingFaceTB/SmolLM2-135M-Instruct"
tokenizer_revision = "12fd25f77366fa6b3b4b768ec3050bf629380bac"

[olmo-3-7b-instruct]
route = "convert"
repo = "allenai/Olmo-3-7B-Instruct"
revision = "6e5971d9eba42665f5bd5a0fcf047f299ce1dccc"
tokenizer_repo = "allenai/Olmo-3-7B-Instruct"
tokenizer_revision = "6e5971d9eba42665f5bd5a0fcf047f299ce1dccc"

[olmo-3-7b-base]
route = "convert"
repo = "allenai/Olmo-3-1025-7B"
revision = "a81bae42db3975be1671e27b9c9a56da1a9f980f"
tokenizer_repo = "allenai/Olmo-3-1025-7B"
tokenizer_revision = "a81bae42db3975be1671e27b9c9a56da1a9f980f"

["llama-3.1-8b-instruct"]  # quoted: a bare dot would nest tables
# Llama 3.1 Community License. Gated: accept Meta's licence on the model's Hugging Face
# page, then log in with `hf auth login`. NDIF serves the same repo.
route = "convert"
repo = "meta-llama/Llama-3.1-8B-Instruct"
revision = "0e9e39f249a16976918f6564b8830bc894c89659"
tokenizer_repo = "meta-llama/Llama-3.1-8B-Instruct"
tokenizer_revision = "0e9e39f249a16976918f6564b8830bc894c89659"

["llama-3.1-8b-base"]
# Llama 3.1 Community License, gated as above. NDIF serves the same repo.
route = "convert"
repo = "meta-llama/Llama-3.1-8B"
revision = "d04e592bb4f6aa9cfee91e2e20afa771667e1d4b"
tokenizer_repo = "meta-llama/Llama-3.1-8B"
tokenizer_revision = "d04e592bb4f6aa9cfee91e2e20afa771667e1d4b"

[gemma-4-e4b]
# The first chat model `clarity setup` fetches (v0.4.2; Apache 2.0, not gated): llama.cpp's
# ggml-org's Q4_0 file of Gemma 4 E4B, with Google's own tokenizer and chat template. Its
# weights differ from the official ones by more than Q4_0's rounding (measured 2026-11-26),
# so it isn't gemma-4-e4b-official quantised. On a Mac it uses about 3.3 GB of GPU memory
# and keeps about 2.3 GB of input embeddings in host memory (measured at the pin,
# 2026-11-22).
route = "gguf"
repo = "ggml-org/gemma-4-E4B-it-GGUF"
revision = "8903cb408c7df39cde2ed15fac397e6d7be92951"
file = "gemma-4-E4B-it-Q4_0.gguf"
sha256 = "a555b900214b477d8880e7832e0b8925e139b0159640036b09fe472b6f2097f2"
tokenizer_repo = "google/gemma-4-E4B-it"
tokenizer_revision = "4ecc2ba63bcac23ba4a767fc87025b1450f84c9c"

[gemma-4-e4b-official]
# Google's own Gemma 4 E4B weights (Apache 2.0, not gated), converted to a bf16 GGUF.
# `clarity vector make` reads these weights with the Transformers backend, and llama.cpp
# runs the GGUF. The tokenizer revision is gemma-4-e4b's, so a chat on either entry renders the
# same prompt. The download is 16.0 GB and stays in the Hugging Face cache; the GGUF in
# models/gemma-4-e4b-official is kept beside it.
route = "convert"
repo = "google/gemma-4-E4B-it"
revision = "4ecc2ba63bcac23ba4a767fc87025b1450f84c9c"
tokenizer_repo = "google/gemma-4-E4B-it"
tokenizer_revision = "4ecc2ba63bcac23ba4a767fc87025b1450f84c9c"

[bge-m3]
# The embedder for meaning search (MIT). BAAI ships its weights only as pytorch_model.bin.
route = "convert"
repo = "BAAI/bge-m3"
revision = "5617a9f61b028005a4858fdac845db406aefb181"
weights = "pytorch_model.bin"
weights_sha256 = "b5e0ce3470abf5ef3831aa1bd5553b486803e83251590ab7ff35a117cf6aad38"
tokenizer_repo = "BAAI/bge-m3"
tokenizer_revision = "5617a9f61b028005a4858fdac845db406aefb181"

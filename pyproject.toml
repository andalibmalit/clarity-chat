[project]
name = "clarity-chat"
version = "0.4.7"
description = "Clarity: a chat client for exact, replayable prompting experiments with local LLMs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andalib Samandari", email = "andalibmalit@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",  # steering vectors; also a dependency of transformers
    "prompt-toolkit>=3.0.53",
    "pypdf==7.1.0",
    "starlette>=1.0.1",
    "tokenizers>=0.23.3",
    "transformers>=5.22.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
clarity = "clarity_chat.cli:main"

[project.optional-dependencies]
hf = [
    "torch>=2.15.0",
]
inspect = [  # clarity export --format inspect writes through its own writer (v0.4.3)
    "inspect-ai==0.3.291",  # pinned: Inspect promises its API, not its log format
]

[build-system]
requires = ["uv_build>=0.11,<1"]
build-backend = "uv_build"

[tool.uv]
# The build-system's uv_build range: uv builds Clarity with its own backend only in that
# range. Outside it, uv would fetch uv_build from the index unhashed (uv.lock doesn't lock
# build dependencies), so such a uv refuses instead. A test keeps the two ranges equal. The
# bound is <1, not the next minor: every uv before 1.0 builds with its own backend, and uv
# warns about a uv_build range with no upper bound.
required-version = ">=0.11,<1"

[tool.uv.build-backend]
module-name = "clarity_chat"

[dependency-groups]
browser = [
    "pytest-playwright>=0.10.0",
]
dev = [
    "gguf==0.19.0",  # tests write control vectors with the reference writer; never imported by Clarity
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "shellcheck-py==0.11.0.1",  # pinned: tests/test_install.py runs ShellCheck 0.11.0 on install.sh
    "ty==0.0.99",  # pinned: ty is pre-1.0 and its checks change between releases
]
setup = [  # clarity setup builds llama-server with this cmake, run by its path (v0.4.2 A2)
    "cmake==4.4.5",  # pinned: the build tool can change the binary
]

[tool.ruff]
line-length = 100
extend-exclude = ["vendor", "models", "logs", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "PLW1514"]
# ANN: every function in src/ has type hints (ty checks them). Any is allowed for JSON data.
ignore = ["ANN401"]
# PLW1514 (open() without an explicit encoding) is a preview rule: enable just that one.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
# torch comes with the optional `hf` extra; a base install has no torch to resolve.
allowed-unresolved-imports = ["torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default. Opt in with `pytest -m live` (SmolLM2 via llama-server),
# `pytest -m olmo` (OLMo 3, needs it fetched), `pytest -m llama` (Llama 3.1 8B, needs it
# fetched), `pytest -m hf` (Transformers backend) or
# `pytest -m measure -s` (timings and memory for design decisions; prints, barely asserts) or
# `pytest -m browser` (the web UI in Chrome; needs `uv sync --group browser`) or
# `pytest -m gate -s` (a first model's gate on a scratch root: tests/test_gate_e4b.py) or
# `pytest -m setup -s` (setup's steps for real into a temporary folder; network to GitHub).
addopts = "-m 'not live and not olmo and not llama and not hf and not measure and not embed and not browser and not gate and not setup'"
markers = [
    "live: needs the built llama-server and the fetched SmolLM2 model",
    "gpu: a live test that needs the model on a GPU; CI's CPU job deselects it",
    "olmo: needs the fetched OLMo 3 models",
    "llama: needs the fetched Llama 3.1 8B models (and the hf extra for Transformers)",
    "hf: needs the hf extra (torch) and a fetched model",
    "measure: measurements on OLMo 3 for design decisions; run with -s to see them",
    "embed: needs the fetched bge-m3, the embedding model for meaning search",
    "browser: the web UI in a real browser (Playwright; `uv sync --group browser`)",
    "gate: a first model's gate (v0.4.2 A0); needs CLARITY_GATE_ROOT and GATE_MODEL",
    "setup: clarity setup's steps for real, into a temporary folder; needs network to GitHub",
]

{# The attachments waiting for your next message (v0.3.1 C1), as chips, each with its ×. #}{% for a in pending %}<span class="chip" role="listitem"><svg class="icon sm" aria-hidden="true"><use href="#i-doc"></use></svg><span class="nm">{{ a.name }}</span> <span class="m">· {{ "whole" if a.how == "whole" else a.unit ~ "s " ~ a.range[0] ~ "–" ~ a.range[1] }} · {{ "{:,}".format(a.tokens) }} tokens</span><button type="button" class="x" data-action="detach" data-n="{{ a.n }}" aria-label="Remove {{ a.name }}"><svg class="icon sm" aria-hidden="true"><use href="#i-close"></use></svg></button></span>
{% endfor %}

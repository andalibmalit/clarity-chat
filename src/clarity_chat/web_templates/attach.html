{# The attach sheet's data, from `/attach ID [range] check`, in the words of commands.check_lines (SENTENCES; v0.3.1 B3). C1 draws it as the board does. #}{% if error %}<div class="problem"><p role="alert"><strong>!</strong> {{ error }}</p></div>
{% else %}<h2 id="attach-title" tabindex="-1">{{ check.name }}</h2>
{% for line in lines %}<p>{{ line }}</p>
{% endfor %}{% endif %}
